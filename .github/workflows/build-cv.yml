name: CI (PDFs + tests)

# Validates every push and PR — builds the PDFs, runs the Ruby test suite,
# and uploads the renders as artifacts. The actual deploy to
# cycomachead.github.io/cv lives in deploy.yml and only runs on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # All handcrafted LaTeX lives in latex/ (see latex/README.md), and
      # main.tex \input{}s its sections by bare name — so latexmk has to run
      # with latex/ as the working directory. The PDFs land there too.
      #
      # main.tex uses \usepackage{fontspec} + Source Sans 3 (né Source Sans
      # Pro), which requires lualatex (or xelatex). The fonts ship with TeX
      # Live itself (the sourcesanspro package), so no extra system font
      # packages are needed — and the Debian-style fonts-* names don't exist
      # in the action's Alpine image anyway.
      - name: Build full CV (latex/main.tex)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: latex
          root_file: main.tex
          latexmk_use_lualatex: true

      - name: Build one-page resume
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: latex
          root_file: one-page-resume.tex
          latexmk_use_lualatex: true

      # public.tex is deployed as the default cv.pdf download — build it here
      # too so a PR can't break it and only fail later in deploy.yml.
      - name: Build public CV
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: latex
          root_file: public.tex
          latexmk_use_lualatex: true

      # Surface the full LaTeX logs when a compile fails — the action's
      # console output truncates luaotfload/fontspec details.
      - name: Print LaTeX logs on failure
        if: failure()
        run: |
          for f in latex/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload LaTeX logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: "latex/*.log"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload PDFs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            latex/main.pdf
            latex/public.pdf
            latex/one-page-resume.pdf
          if-no-files-found: error
          retention-days: 90

  test-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Render cv.md and HTML preview
        run: |
          bundle exec rake site:md
          bundle exec rake site:preview

      - name: Upload Markdown artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-md
          path: |
            build/cv.md
            build/cv.html
          if-no-files-found: error
          retention-days: 30
