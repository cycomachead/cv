name: CI (PDFs + tests)

# Validates every push and PR — builds the PDFs, runs the Ruby test suite,
# and uploads the renders as artifacts. The actual deploy to
# cycomachead.github.io/cv lives in deploy.yml and only runs on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # main.tex uses \usepackage{fontspec} + Source Sans Pro, which requires
      # lualatex (or xelatex).
      - name: Build full CV (main.tex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          extra_system_packages: "fonts-sourcecodepro fonts-sourcesanspro"

      - name: Build one-page resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: one-page-resume.tex
          latexmk_use_lualatex: true

      - name: Upload PDFs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            main.pdf
            one-page-resume.pdf
          if-no-files-found: error
          retention-days: 90

  test-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Render cv.md and HTML preview
        run: |
          bundle exec rake site:md
          bundle exec rake site:preview

      - name: Upload Markdown artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-md
          path: |
            build/cv.md
            build/cv.html
          if-no-files-found: error
          retention-days: 30
