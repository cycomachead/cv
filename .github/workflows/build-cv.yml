name: Build CV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for the `pdfs` branch publish step
    steps:
      - uses: actions/checkout@v4

      # main.tex uses \usepackage{fontspec} + Source Sans Pro, which requires
      # lualatex (or xelatex). The one-pager only needs pdflatex but we run
      # both with lualatex for consistency.
      - name: Build full CV (main.tex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          extra_system_packages: "fonts-sourcecodepro fonts-sourcesanspro"

      - name: Build one-page resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: one-page-resume.tex
          latexmk_use_lualatex: true

      - name: Upload PDFs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            main.pdf
            one-page-resume.pdf
          if-no-files-found: error
          retention-days: 90

      # On pushes to main, also publish the latest PDFs to a `pdfs` branch so
      # you always have a stable URL (raw.githubusercontent.com/.../pdfs/...).
      - name: Stage PDFs for publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _publish
          cp main.pdf one-page-resume.pdf _publish/

      - name: Publish PDFs to `pdfs` branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pdfs
          publish_dir: ./_publish
          keep_files: false
          commit_message: "Build PDFs from ${{ github.sha }}"

  build-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for the `gh-pages` deploy step
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Build HTML site
        run: bundle exec rake site:build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-site
          path: build/site
          if-no-files-found: error
          retention-days: 90

      # On pushes to main, deploy the rendered HTML to gh-pages. Pair with
      # GitHub Pages' "Deploy from branch → gh-pages" setting (or copy the
      # contents into cycomachead.github.io) to get a public URL.
      - name: Deploy to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build/site
          keep_files: false
          commit_message: "Build site from ${{ github.sha }}"
