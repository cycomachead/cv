name: CI (PDFs + tests)

# Validates every push and PR — builds the PDFs, runs the Ruby test suite,
# and uploads the renders as artifacts. The actual deploy to
# cycomachead.github.io/cv lives in deploy.yml and only runs on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CV PDFs are generated from data/*.yml, so Ruby has to run before
      # LaTeX: `rake tex:build` writes build/cv.tex plus the cv-full /
      # cv-public / cv-unredacted wrappers that \input it.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Render LaTeX from YAML
        run: bundle exec rake tex:build

      # The generated document uses \usepackage{fontspec} + Source Sans 3 (né
      # Source Sans Pro), which requires lualatex (or xelatex). The fonts ship
      # with TeX Live itself (the sourcesanspro package), so no extra system
      # font packages are needed — and the Debian-style fonts-* names don't
      # exist in the action's Alpine image anyway.
      - name: Build full CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: build/cv-full.tex
          work_in_root_file_dir: true
          latexmk_use_lualatex: true

      # cv-public.pdf is deployed as the site-root download — build it here too
      # so a PR can't break it and only fail later in deploy.yml.
      - name: Build public CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: build/cv-public.tex
          work_in_root_file_dir: true
          latexmk_use_lualatex: true

      # The one-page résumé has no YAML source and stays hand-written.
      - name: Build one-page resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: latex/one-page-resume.tex
          work_in_root_file_dir: true
          latexmk_use_lualatex: true

      # Surface the full LaTeX logs when a compile fails — the action's
      # console output truncates luaotfload/fontspec details.
      - name: Print LaTeX logs on failure
        if: failure()
        run: |
          for f in build/*.log latex/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload LaTeX logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: |
            build/*.log
            latex/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload PDFs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            build/cv-full.pdf
            build/cv-public.pdf
            latex/one-page-resume.pdf
          if-no-files-found: error
          retention-days: 90

  test-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Render cv.md and HTML preview
        run: |
          bundle exec rake site:md
          bundle exec rake site:preview

      - name: Upload Markdown artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-md
          path: |
            build/cv.md
            build/cv.html
          if-no-files-found: error
          retention-days: 30
