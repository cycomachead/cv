name: Build & deploy CV to cycomachead.github.io/cv

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time — protects the external repo from racing pushes.
concurrency:
  group: deploy-cv
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 0. Preflight: the deploy token must exist ----------
      # Without CYCOMACHEAD_GH_PAGES_TOKEN the final push to
      # cycomachead.github.io silently no-ops, so the /cv page + the root
      # michael-ball-cv.pdf never land and mball.co/cv 404s even though the
      # build is green. Fail fast with an actionable message instead. See the
      # "One-time setup" section of README.md.
      - name: Verify deploy token is configured
        env:
          DEPLOY_TOKEN: ${{ secrets.CYCOMACHEAD_GH_PAGES_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::CYCOMACHEAD_GH_PAGES_TOKEN is not set. The CV cannot be" \
                 "deployed to cycomachead.github.io, so mball.co/cv will 404." \
                 "Add a fine-grained PAT (Contents: Read and write on" \
                 "cycomachead/cycomachead.github.io) as a repo secret — see README.md."
            exit 1
          fi

      # ---------- 1. Build PDFs from LaTeX ----------
      # The Source Sans 3 fonts ship with TeX Live itself (the sourcesanspro
      # package), so no extra system font packages are needed — the
      # Debian-style fonts-* names don't exist in the action's Alpine image.
      - name: Build full CV (main.tex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true

      - name: Build one-page resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: one-page-resume.tex
          latexmk_use_lualatex: true

      # public.tex is a wrapper that excludes references for the public site.
      - name: Build public CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: public.tex
          latexmk_use_lualatex: true

      # Surface the full LaTeX logs when a compile fails — the action's
      # console output truncates luaotfload/fontspec details.
      - name: Print LaTeX logs on failure
        if: failure()
        run: |
          for f in *.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload LaTeX logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: "*.log"
          if-no-files-found: ignore
          retention-days: 7

      # ---------- 2. Build cv.md from YAML+bib ----------
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Render cv-embed.md + sidebar fragment + assets
        run: bundle exec rake site:embed

      # ---------- 3. Stage the files for the external repo ----------
      # The staged tree mirrors where each file lands in cycomachead.github.io
      # so the whole bundle deploys in a single commit (one Jekyll rebuild):
      #
      #   cv/index.md            — markdown body, no in-page header (the site
      #                            cv layout supplies its own page title)
      #   cv/cv-sidebar.html     — sidebar fragment with download buttons +
      #                            section TOC + dark mode toggle
      #   cv/cv.css, cv/cv-theme.js, cv/cv-nav.js — the styles, the dark-mode
      #                            toggle, and the TOC scroll spy
      #   cv/cv-full.pdf, cv/resume.pdf — the secondary download targets
      #   michael-ball-cv.pdf    — the public CV at the site root, the canonical
      #                            download linked from /cv and served at
      #                            mball.co/michael-ball-cv.pdf
      - name: Stage deploy bundle
        run: |
          set -euo pipefail
          mkdir -p _deploy/cv
          cp build/cv-embed.md         _deploy/cv/index.md
          cp build/cv-sidebar.html     _deploy/cv/cv-sidebar.html
          cp build/cv.css              _deploy/cv/cv.css
          cp build/cv-theme.js         _deploy/cv/cv-theme.js
          cp build/cv-nav.js           _deploy/cv/cv-nav.js
          cp main.pdf                  _deploy/cv/cv-full.pdf
          cp one-page-resume.pdf       _deploy/cv/resume.pdf
          cp public.pdf                _deploy/michael-ball-cv.pdf
          find _deploy -type f | sort

      # ---------- 4. Push to cycomachead/cycomachead.github.io ----------
      # We deploy INTO the Jekyll *source* branch (main) of the site repo,
      # which GitHub builds via its own Actions workflow. So the push must
      # touch ONLY the CV bundle (cv/ + the root PDF) and leave everything
      # else — crucially .github/workflows/jekyll.yml — untouched.
      #
      # We do NOT use peaceiris/actions-gh-pages here: it's built to publish
      # *built output* to a gh-pages branch and, against a source branch, its
      # defaults drop a .nojekyll file (which disables Jekyll) and its sync
      # removed the site's jekyll.yml build workflow — leaving mball.co/cv a
      # 404 because Pages stopped building. This surgical clone/copy/commit
      # only ever stages `cv/` and `michael-ball-cv.pdf`, so it can never
      # clobber the rest of the site.
      #
      # Requires a PAT (CYCOMACHEAD_GH_PAGES_TOKEN) with `contents: write` on
      # the target repo. Because it never writes under .github/workflows/, the
      # token does NOT need the `workflows` permission. See README.md.
      # Pushing to main triggers the site's own Jekyll deploy workflow.
      - name: Deploy to cycomachead.github.io
        env:
          DEPLOY_TOKEN: ${{ secrets.CYCOMACHEAD_GH_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/cycomachead/cycomachead.github.io.git" \
            site

          # Sync only the CV bundle. --delete prunes stale files, but scoped to
          # cv/ so it can't affect anything outside that directory.
          rsync -a --delete _deploy/cv/ site/cv/
          cp _deploy/michael-ball-cv.pdf site/michael-ball-cv.pdf

          cd site
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv michael-ball-cv.pdf

          if git diff --cached --quiet; then
            echo "No CV changes to deploy."
            exit 0
          fi

          git commit -m "cv: build from cycomachead/cv@${GITHUB_SHA}"
          git push origin HEAD:main
