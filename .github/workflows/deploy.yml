name: Build & deploy CV to cycomachead.github.io/cv

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time — protects the external repo from racing pushes.
concurrency:
  group: deploy-cv
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 1. Build PDFs from LaTeX ----------
      - name: Build full CV (main.tex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          extra_system_packages: "fonts-sourcecodepro fonts-sourcesanspro"

      - name: Build one-page resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: one-page-resume.tex
          latexmk_use_lualatex: true

      # public.tex is a wrapper that excludes references for the public site.
      - name: Build public CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: public.tex
          latexmk_use_lualatex: true
          extra_system_packages: "fonts-sourcecodepro fonts-sourcesanspro"

      # ---------- 2. Build cv.md from YAML+bib ----------
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Render cv-embed.md + sidebar fragment + assets
        run: bundle exec rake site:embed

      # ---------- 3. Stage the files for the external repo ----------
      # The Jekyll site at cycomachead.github.io/cv/ consumes:
      #   index.md            — markdown body, no in-page header (the site
      #                         layout supplies its own page title)
      #   cv-sidebar.html     — sidebar fragment with download buttons +
      #                         section TOC + dark mode toggle
      #   cv.css, cv-theme.js — the styles + script the sidebar/body need
      #   cv.pdf, resume.pdf  — the download targets
      - name: Stage deploy bundle
        run: |
          set -euo pipefail
          mkdir -p _deploy
          cp build/cv-embed.md         _deploy/index.md
          cp build/cv-sidebar.html     _deploy/cv-sidebar.html
          cp build/cv.css              _deploy/cv.css
          cp build/cv-theme.js         _deploy/cv-theme.js
          cp public.pdf                _deploy/cv.pdf
          cp main.pdf                  _deploy/cv-full.pdf
          cp one-page-resume.pdf       _deploy/resume.pdf
          ls -la _deploy

      # ---------- 4. Push to cycomachead/cycomachead.github.io ----------
      # Requires a PAT (CYCOMACHEAD_GH_PAGES_TOKEN) with `contents: write` on
      # the target repo, stored as a repository secret. See README.md.
      - name: Deploy to cycomachead.github.io/cv
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token:      ${{ secrets.CYCOMACHEAD_GH_PAGES_TOKEN }}
          external_repository: cycomachead/cycomachead.github.io
          publish_branch:      main
          publish_dir:         ./_deploy
          destination_dir:     cv
          keep_files:          true   # preserve the rest of cycomachead.github.io
          commit_message:      "cv: build from cycomachead/cv@${{ github.sha }}"
          user_name:           "github-actions[bot]"
          user_email:          "41898282+github-actions[bot]@users.noreply.github.com"
