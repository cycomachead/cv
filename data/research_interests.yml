- title: Computer Science Education
  description: >-
    Most experienced in high school, CS0, and CS1 courses. Particularly
    interested in exploring and improving structural issues in courses, such
    as sound principles for course policies, teaching with teams, and
    effective use of education technology.

- title: Digital Accessibility
  description: >-
    Experience building tools for software teams to improve the accessibility
    of web applications. Interested in improving methods for automatically
    detecting accessibility defects and recommending corrections, and in
    building accessible CS courses and materials to teach accessibility to
    students.
