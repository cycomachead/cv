courses:
  - code: CS 10
    title: The Beauty and Joy of Computing
    units: 4
    description: >-
      Non-majors introduction to computer science. Hands-on, project-based
      course taught using Snap! and Python.
    url: https://cs10.org
  - code: CS 88 / DATA C88C
    title: Computational Structures for Data Science
    units: 3
    description: >-
      CS1-or-1.5 course for data science majors, based on Sussman's SICP and
      taught in Python.
    url: https://c88c.org
  - code: CS 169
    title: Engineering Software as a Service
    units: 4
    description: >-
      The original software engineering course, later split into CS169A and
      CS169L.
    url: https://saasbook.info
  - code: CS 169A
    title: Engineering Software as a Service
    units: 4
    description: >-
      Upper-division course on modern software engineering through RESTful
      design, HTTP, and team projects.
    url: https://saasbook.info
  - code: CS 169L
    title: Software Engineering Team Project
    units: 4
    description: >-
      Follow-up to CS 169A; teams build a semester-long project for a campus
      organization or local nonprofit.
    url: https://saasbook.info
  - code: CS W186
    title: Introduction to Databases
    units: 4
    description: Upper-division databases course offered in an online format.
  - code: CS 194-23
    title: Art & Science of Digital Photography
    units: 4
    description: Highly technical photography course bridging art and engineering.
  - code: CS 195 / CS H195
    title: The Social Implications of Computing Technology
    units: 1 / 3
    description: >-
      Course exploring the unintended consequences of computing, including
      the culture of how we build programs. H195 is an honors course where
      students complete a small research project.
  - code: CS 294-188
    title: Design and Evaluation of CS at Scale
    units: 1
    description: >-
      Pedagogy course for teaching assistants on course-course collaborations
      and current computing-education pedagogy.
  - code: CS 302
    title: Designing Computer Science Education
    units: 3
    description: >-
      Course preparing students to be the instructor of record for a summer
      CS course.
  - code: CS 375
    title: Teaching Practicum
    units: 2
    description: First-time CS teaching assistant training.
  - code: DATA 101 / CS C187
    title: Data Engineering
    units: 4
    description: >-
      Upper-division course putting databases into practice. Topics include
      SQL, window functions, indexing, design, ETL, NoSQL, and graph
      databases.
    url: https://data101.org

notes:
  - "* denotes courses that were co-taught."
  - Spring 2020 included an abrupt switch to remote instruction.
  - Fall 2020 and Spring 2021 were entirely remote semesters.
  - Fall 2021, Spring 2022, and Fall 2022 included significant hybrid teaching components.

