- when:    2014
  title:   "NSF STEM-C BJC4NYC: Bringing the Beauty and Joy of Computing to the Largest School System in the US"
  amount:  "$7,874,876"
  role:    Consultant
  summary: >-
    Curricular materials, based on the Beauty and Joy of Computing, for
    teaching CS Principles at the high-school level using Snap!. Trained
    100 NYC high-school teachers; reviewed/edited curriculum with EDC;
    developed BJCx (with auto-grading) as a SPOC; supported teachers
    online.
  # Long form, from the handcrafted latex/5-awards.tex.
  # summary: >-
  #   For the development of curricular materials, based on the Beauty and Joy
  #   of Computing, for teaching CS Principles at the high school level using
  #   the Snap! programming language. Development of the Snap! language,
  #   including the cloud back-end, and BJC curriculum software. During the
  #   project, 100 high school teachers in New York City were trained to teach
  #   BJC, and early participants became teacher-trainers who worked with later
  #   participants. The teachers involved became part of a Community of
  #   Practice that continues to provide support for the teacher cohorts. I
  #   worked with EDC curriculum developers to review and suggest changes,
  #   developed BJCx (with auto-grading features) for teachers as a small
  #   private online course (SPOC), and supported BJC teachers online.

